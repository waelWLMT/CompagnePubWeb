<div class="container my-4">
    <div class="row align-items-stretch" style="min-height: 400px;">

        <!-- Colonne Carte Leaflet -->
        <div class="col-md mb-3 mb-md-0">
            <div class="map-container">
                <div class="map-frame">
                    <div id="map"></div>
                </div>
            </div>
        </div>

        <!-- Colonne Card -->
        <div *ngIf="showBusinessDetails" class="col-md-4 d-flex" style="padding: 10px;">

            <div class="card w-100">

                <div class="card-header">
                    <h5 class="card-title">{{ selectedBusiness.place.name }}</h5>
                </div>

                <div class="card-body">
                    <ul class="list-group list-group-flush text-left">
                        <li class="list-group-item">
                            
                            <p class="card-text">
                                <b>Type: </b> 
                                <span>
                                    {{ selectedBusiness.businessTypeLabel }} 
                                </span> 
                            </p>
                                                  
                        </li>

                        <li class="list-group-item">
                            
                            <p class="card-text">
                                <b>Adresse:</b>
                                <span>
                                    {{ selectedBusiness.place.placeAdresse }}
                                </span>
                            </p>
                                                       
                        </li>
                    </ul>
                </div>

                <div class="card-footer">
                    <button type="button" (click)="closeDetails()" class="btn btn-secondary">Fermer</button>                    
                </div>

            </div>

        </div>

    </div>
</div>
